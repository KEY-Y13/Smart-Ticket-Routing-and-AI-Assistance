[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartticket-ai"
version = "1.0.0"
description = "Auditable ticket routing and AI assistance for a fictional 3C retailer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "numpy>=1.26.4,<3",
  "scikit-learn>=1.7,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
backend = [
  "SQLAlchemy==2.0.57", "alembic==1.20.1", "PyMySQL[rsa]==1.2.3",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "psutil>=7,<8",
]

[project.scripts]
smartticket-data = "nlp.cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "nlp*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires an explicitly isolated integration dependency"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".conda*", ".venv*", "artifacts", ".mysql-local", ".docker-secrets", "docs/00-原始需求.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.fastapi]
entrypoint = "backend.app.main:app"
